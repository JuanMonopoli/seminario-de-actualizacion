function dibujarCruzDiagonal(ctx, ancho, alto) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(ancho, alto);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(ancho, 0);
    ctx.lineTo(0, alto);
    ctx.stroke();
}

function dibujarTriangulo(ctx, p1, p2, p3) {

    ctx.beginPath();
   
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.stroke();
}

function dibujarPoligonoCentrado(ctx, puntos, anchoCanvas, altoCanvas) {
    if (!puntos || puntos.length < 3) return; 

    let sumaX = 0;
    let sumaY = 0;
    puntos.forEach(p => {
        sumaX += p.x;
        sumaY += p.y;
    });
    let centroideX = sumaX / puntos.length;
    let centroideY = sumaY / puntos.length;

    let offsetX = (anchoCanvas / 2) - centroideX;
    let offsetY = (altoCanvas / 2) - centroideY;

    ctx.beginPath();
    ctx.moveTo(puntos[0].x + offsetX, puntos[0].y + offsetY);
    for (let i = 1; i < puntos.length; i++) {
        ctx.lineTo(puntos[i].x + offsetX, puntos[i].y + offsetY);
    }
    ctx.closePath();
    ctx.stroke();
}

// Dibuja un polígono centrado relleno con un gradiente lineal a 45° entre dos
// colores en notación HEX. Reutiliza dibujarPoligonoCentrado: esa función arma el
// camino y lo traza, y como stroke() no borra el camino actual, acá se lo puede
// rellenar a continuación con fill().
function dibujarPoligonoConGradiente(ctx, puntos, anchoCanvas, altoCanvas, colorHex1, colorHex2) {
    if (!puntos || puntos.length < 3) return;

    dibujarPoligonoCentrado(ctx, puntos, anchoCanvas, altoCanvas);

    // posición final de los puntos (mismo desplazamiento que aplicó la función anterior)
    let sumaX = 0;
    let sumaY = 0;
    puntos.forEach(p => {
        sumaX += p.x;
        sumaY += p.y;
    });
    let offsetX = (anchoCanvas / 2) - sumaX / puntos.length;
    let offsetY = (altoCanvas / 2) - sumaY / puntos.length;

    let xs = puntos.map(p => p.x + offsetX);
    let ys = puntos.map(p => p.y + offsetY);

    // caja que contiene al polígono y su centro
    let ancho = Math.max(...xs) - Math.min(...xs);
    let alto = Math.max(...ys) - Math.min(...ys);
    let cx = (Math.max(...xs) + Math.min(...xs)) / 2;
    let cy = (Math.max(...ys) + Math.min(...ys)) / 2;

    // dirección de 45°: (cos 45°, sin 45°)
    let dx = Math.SQRT1_2;
    let dy = Math.SQRT1_2;

    // mitad de lo que mide la caja proyectada sobre esa dirección:
    // el color 1 arranca en una esquina de la caja y el color 2 en la opuesta
    let mitad = (ancho / 2) * dx + (alto / 2) * dy;

    let gradiente = ctx.createLinearGradient(
        cx - dx * mitad, cy - dy * mitad,
        cx + dx * mitad, cy + dy * mitad
    );
    gradiente.addColorStop(0, colorHex1);
    gradiente.addColorStop(1, colorHex2);

    ctx.fillStyle = gradiente;
    ctx.fill();
    ctx.stroke(); // se vuelve a trazar el contorno para que quede por encima del relleno
}
