class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);

window.onload = main;



function dibujarCirculoRadial(ctx, anchoCanvas, altoCanvas, radio, colorCentro, colorBorde) {
    let cx = anchoCanvas / 2;
    let cy = altoCanvas / 2;

    let gradiente = ctx.createRadialGradient(cx, cy, 0, cx, cy, radio);
    gradiente.addColorStop(0, colorCentro);
    gradiente.addColorStop(1, colorBorde);

    ctx.beginPath();
    ctx.arc(cx, cy, radio, 0, Math.PI * 2);
    ctx.fillStyle = gradiente;
    ctx.fill();
    ctx.stroke();
}
