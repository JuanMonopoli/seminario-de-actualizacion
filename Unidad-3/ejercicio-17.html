function dibujarCilindro(ctx, anchoCanvas, altoCanvas, radioX, radioY, alto) {
    let cx = anchoCanvas / 2;
    let yTapa = altoCanvas / 2 - alto / 2;   
    let yBase = yTapa + alto;                

    ctx.beginPath();
    ctx.moveTo(cx - radioX, yTapa);
    ctx.lineTo(cx - radioX, yBase);
    ctx.ellipse(cx, yBase, radioX, radioY, 0, Math.PI, 0, true);
    ctx.lineTo(cx + radioX, yTapa);
    ctx.ellipse(cx, yTapa, radioX, radioY, 0, 0, Math.PI, false);
    ctx.closePath();

    let gradienteCuerpo = ctx.createLinearGradient(cx - radioX, 0, cx + radioX, 0);
    gradienteCuerpo.addColorStop(0,    '#1a3f73'); 
    gradienteCuerpo.addColorStop(0.25, '#5aa0f0');
    gradienteCuerpo.addColorStop(0.4,  '#9fd0ff'); 
    gradienteCuerpo.addColorStop(0.7,  '#3b78c4');
    gradienteCuerpo.addColorStop(1,    '#123055'); 

    ctx.fillStyle = gradienteCuerpo;
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, yTapa, radioX, radioY, 0, 0, Math.PI * 2);

    let gradienteTapa = ctx.createLinearGradient(cx - radioX, yTapa - radioY, cx + radioX, yTapa + radioY);
    gradienteTapa.addColorStop(0, '#e3f1ff');
    gradienteTapa.addColorStop(1, '#7fb4f0');

    ctx.fillStyle = gradienteTapa;
    ctx.fill();
    ctx.stroke();
}
